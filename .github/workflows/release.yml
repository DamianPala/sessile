name: Release

# A tag `vX.Y.Z` builds the CLI for every platform and publishes a GitHub
# release with the archives. A manual run builds the same archives as
# workflow artifacts and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: cli
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: cli/target/${{ matrix.target }}/release/sessile schema > /dev/null
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="sessile-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "cli/target/${{ matrix.target }}/release/sessile.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "cli/target/${{ matrix.target }}/release/sessile" "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sessile-${{ matrix.target }}
          path: |
            sessile-${{ matrix.target }}.tar.gz
            sessile-${{ matrix.target }}.zip
          if-no-files-found: error

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum sessile-* > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
