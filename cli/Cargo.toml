[package]
name = "sessile"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Browse, search, rename, archive, export and delete Claude Code sessions"
license = "MIT"
repository = "https://github.com/DamianPala/sessile"
readme = "README.md"

[lib]
name = "sessile"
path = "src/lib.rs"

[[bin]]
name = "sessile"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
memchr = "2.8.3"
memmap2 = "0.9.11"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 4

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
